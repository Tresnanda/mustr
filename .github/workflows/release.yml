name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          # Intel runners are retired; cross-compile on Apple Silicon.
          - target: x86_64-apple-darwin
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and draft the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Stable self-signed Apple identity: turns Gatekeeper's fatal
          # "damaged" dialog on browser downloads into the recoverable
          # right-click → Open flow, and keeps macOS permissions across
          # updates. Not notarization — the curl installer stays the
          # zero-dialog path.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Mustr Self-Signed"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Mustr ${{ github.ref_name }}
          releaseDraft: true
          args: --target ${{ matrix.target }}
          includeUpdaterJson: true
          releaseBody: |
            See CHANGELOG for details.

            **Compatibility:** herdr 0.8.0 / protocol 19.

            **Install** (avoids Gatekeeper's "damaged" dialog on this unsigned app):
            ```sh
            curl -fsSL https://raw.githubusercontent.com/Tresnanda/mustr/main/install.sh | sh
            ```
            If you download the DMG in a browser instead, clear the quarantine flag
            after copying to Applications:
            `xattr -dr com.apple.quarantine /Applications/Mustr.app`.
            Updates after the first install arrive in-app.
