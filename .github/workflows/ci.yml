name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        run: pnpm exec tsc --noEmit

      - name: Build frontend
        run: pnpm build

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check Rust core
        working-directory: src-tauri
        run: cargo check --locked

  protocol-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify herdr protocol pins
        run: |
          set -euo pipefail
          for gen in 19 20; do
            tag=$(grep -E "^tag$gen=" .github/herdr-pin | cut -d= -f2)
            sha=$(grep -E "^sha256_$gen=" .github/herdr-pin | cut -d= -f2)
            protocol=$(grep -E "^protocol$gen=" .github/herdr-pin | cut -d= -f2)
            vendored="src-tauri/src/protocol/wire${protocol}.rs"
            curl -fsSL -o /tmp/upstream-wire.rs \
              "https://raw.githubusercontent.com/herdrdev/herdr/${tag}/src/protocol/wire.rs"
            actual=$(sha256sum /tmp/upstream-wire.rs | cut -d' ' -f1)
            if [ "$actual" != "$sha" ]; then
              echo "::error::Upstream ${tag} wire.rs no longer matches the recorded pin."
              echo "recorded: $sha"
              echo "actual:   $actual"
              exit 1
            fi
            vendored_version=$(sed -nE 's/.*PROTOCOL_VERSION: u32 = ([0-9]+).*/\1/p' "$vendored" | head -1)
            if [ "$vendored_version" != "$protocol" ]; then
              echo "::error::Vendored $vendored PROTOCOL_VERSION ($vendored_version) differs from the pin ($protocol). Re-vendor consciously and update .github/herdr-pin."
              exit 1
            fi
            echo "Pin holds: herdr ${tag}, protocol ${protocol} → $vendored."
          done
